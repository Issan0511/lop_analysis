# proj_004: center_selfcov_0814 Phase 1 — レジーム探索 (spec §4)
#
# 目的: 「µ=0 (c=0) かつ κ>1 で Path B (低ランク化) が進行し、Path A に飲まれていない」
# セルを1つ選ぶ。教師幅 target_hidden を学習器幅から分離できるようにしたので、
# 条件A と同じ容量ギャップを条件B に与えられる (§1.7)。
#
# グリッドは width × target_hidden × kappa × lr の 16 セル (×2 seed)。
# target_hidden 軸は run_all では回せないため src.center_selfcov_p1 が
# target_hidden ごとに config を差し替えて実行する。
# 選定基準は spec §4 (発散なし → srank ≤ 80% → dead < 0.5 → eval_loss 2倍以上 →
# srank 低下最大)。全セルが基準2を満たさなければ Phase 2 に進まず停止する。

common:
  total_steps: 200000
  seeds: [0, 1]
  lr_main: 0.003
  device: auto
  eval_batch: 2000
  lop_every: 1000
  loss_bin: 1000
  checkpoints: [0, 200000]
  run_freeze: false
  w_dir_metrics: true          # §2.2 の W 方向指標を有効化
  freeze_min_periods: 50
  freeze_M_cap: 500000
  dead_tol: 1.0e-7
  dead_tau: 0.95
  dup_tau: 0.95
  sat_ratio_tol: 1.0e-4
  sat_frac: 0.99
  sign_match_tau: 0.95

condA:                          # Phase 1 は条件B のみ
  m: 20
  f: 15
  target_hidden: 100
  beta: 0.7
  T_values: []
  widths: []
  encodings: [std]
  center_alpha: 0.01
  batch_values: [1]
  lr_grid: []

condB:
  d: 21
  K_values: [10000]
  c_values: [0.0]               # µ=0 厳密
  kappa_values: [1, 16]
  widths: [5, 20]
  lr_values: [0.003, 0.01]
  batch_values: [1]
  spike_dir: alt
  target_hidden: null           # src.center_selfcov_p1 が {width(=null), 100} で上書き

center_selfcov_p1:
  target_hidden_values: [null, 100]   # null = 学習器幅と同一 (従来設定)
  srank_ratio_max: 0.8                # 基準2: srank(200k) / srank(0) ≤ 0.8
  dead_max: 0.5                       # 基準3
  evalloss_ratio_min: 2.0             # 基準4
  wnorm_blowup: 100.0                 # 基準1
