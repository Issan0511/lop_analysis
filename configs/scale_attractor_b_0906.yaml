# scale_attractor_0906 の追補: 転移の境目 a ∈ {0.35,0.4,0.45,0.55,0.6,0.65,0.8} を細かく（未登録診断・Issa 指示 09-06）
experiment: scale_attractor_b_0906
host_config: configs/gate_dial_0902.yaml
output:
  dir: results/scale_attractor_b_0906
  logs_tail_dir: results/scale_attractor_b_0906/logs_tail
common_overrides:
