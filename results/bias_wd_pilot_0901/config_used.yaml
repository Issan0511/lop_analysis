      main: 0.5
      sub:
      - 0.9
      - 0.3
      - 0.15
    assignment: greedy_in_target_order
    tie_break: smaller_lambda
    exclude_lambda:
    - 0.0
    span_required:
    - 0.15
    - 0.9
