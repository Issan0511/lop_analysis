    - 0.0
    span_required:
    - 0.15
    - 0.9
    max_decade_shifts: 1
    decade_shift_direction: from_data
  grid_rule_fallback:
    added_after_first_pilot_run: true
    trigger: absolute_targets_above_control_ceiling
    metric: L1_wall_frac_rel_to_lambda0
