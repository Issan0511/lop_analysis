    name: relu
  elu:
    name: elu
    alpha: 1.0
    forward: where(z>0, z, alpha*expm1(z))
    derivative_form: alpha_exp
  leaky:
    name: leaky_relu
    slope: 0.1
    forward: where(z>0, z, slope*z)
    derivative: where(z>0, 1, slope)
  autograd: false
  consumes_rng: false
