activation:
  leaky_off_0:
    name: leaky_off_0
    offset: 0.0
    forward: leaky_relu(z; a)  (加算せず逐語)
    derivative: 1 (z>0) / a (z<=0)
    curvature: '0'
    note: 'S-limit: leaky_relu と bit 一致。本走の参照腕'
  leaky_off_m2:
    name: leaky_off_m2
    offset: -2.0
    forward: leaky_relu(z; a) + c
    derivative: leaky と同一
    curvature: '0'
  leaky_off_m0p5:
    name: leaky_off_m0p5
    offset: -0.5
    forward: leaky_relu(z; a) + c
    derivative: leaky と同一
    curvature: '0'
  leaky_off_p0p5:
    name: leaky_off_p0p5
    offset: 0.5
    forward: leaky_relu(z; a) + c
    derivative: leaky と同一
    curvature: '0'
  leaky_off_p2:
    name: leaky_off_p2
    offset: 2.0
    forward: leaky_relu(z; a) + c
    derivative: leaky と同一
    curvature: '0'
  elu_off_m1:
    name: elu_off_m1
    offset: -1.0
    forward: elu(z; α) + c
    derivative: elu と同一
    curvature: elu と同一
    note: 併記のみ・判定に入れない
  elu_off_p1:
    name: elu_off_p1
    offset: 1.0
    forward: elu(z; α) + c
    derivative: elu と同一
    curvature: elu と同一
    note: 併記のみ・判定に入れない
  leaky_relu:
    name: leaky_relu
