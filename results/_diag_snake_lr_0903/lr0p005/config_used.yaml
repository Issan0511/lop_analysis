  - E_1216
  - R_1216
  - S_b1_1216
  s_cap_window: early_tasks
  s_cap_fallback_window: window_1m_tasks
  s_cap_threshold: 0.05
  s_cap_min_seeds: 9
  s_cap_label: CAPACITY_UNDEFINED
  s_cap_fallback_label: SLOW_FIT
  s_cap_suspects:
  - SN_a1_1216
  - CB1f_a1_1216
  s_taut_check: true
  s_mask_check: true
  s_ref_hash_check: true
  s_cover_check: true
  omp_num_threads: 1
  s6_floor_calibration: false
output:
