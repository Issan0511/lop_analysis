    alpha: 1.0
    equals: comb_binf
    equals_alpha: 1.0
    on_interval_open:
    - -3.141592653589793
    - null
  - act: comb1_flat
    alpha: 1.0
    equals: comb_binf
    equals_alpha: 1.0
    on_interval_open:
    - -3.141592653589793
    - null
  - act: band_leaky_d0
    alpha: 0.1
    equals: leaky_relu
    equals_alpha: 0.1
  s_limit_lobe_endpoint_excluded: true
  s_limit_snake_alpha: 1.0e-06
  s_limit_snake_rel_tol: 0.0001
  s_dose_rel_tol: 1.0e-10
  s_fd_tol: 1.0e-06
  s_fd_range:
  - -20.0
  - 20.0
  s_fd_points: 41
  s_fd_kink_offsets:
  - 0.1
  s_fd_kink_exclusion: 0.001
  s_fd_relative_for: []
  s_num_range:
  - -200.0
  - 200.0
  s_num_points: 40001
  s_num_record_saturation_depth: true
  s_dial_check: true
  s_dial_rel_tol: 0.06
  s_const_check: true
  s_mob_steps: 30000
  s_mob_tol: 1.0e-06
  s_mob_band_identity: mob_equals_p_hat_plus_a_times_prob_z_below_minus_d
  s_mob_zmin_order: zmin_le_zmean_le_zmax
  s_log_b_steps: 30000
  s_guard_check: true
