activation:
  relu:
    name: relu
  leaky:
    name: leaky_relu
    forward: where(z>0, z, a*z)
    derivative: where(z>0, 1, a)
    dial_symbol: a
  elu:
    name: elu
    forward: where(z>0, z, alpha*expm1(z))
    derivative_form: alpha_exp
    dial_symbol: alpha
  silu:
    name: silu
    forward: z*sigmoid(beta*z)
    derivative: sigmoid(b)*(1 + b*(1-sigmoid(b))) with b = beta*z
    stable_form: torch.sigmoid
    dial_symbol: beta
    has_valley: true
  gelu:
    name: gelu
    forward: z*Phi(beta*z)
    derivative: Phi(b) + b*phi(b) with b = beta*z
    exact_erf: true
    dial_symbol: beta
    has_valley: true
  autograd: false
  consumes_rng: false
  is_true_gradient: true
intervention:
  name: oracle_fixed_mu_offset
  oracle: true
  consumes_rng: false
  center_alpha_compat: 0.01
  is_ema_centering: false
